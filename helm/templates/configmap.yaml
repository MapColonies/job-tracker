{{- $configmapName := include "configmap.fullname" . }}
{{- $jobDefinitions := (include "common.jobDefinitions.merged" .) | fromYaml }}
{{- $suspendingTaskTypes := include "suspendingTaskTypes" . }}
{{- $serviceUrls := (include "common.serviceUrls.merged" .) | fromYaml }}
{{- $server := .Values.server -}}
{{- $telemetry := .Values.telemetry -}}
{{- $tracingUrl := include "job-tracker.tracingUrl" . -}}
{{- $opentelemetryLoggingUrl := include "job-tracker.opentelemetryLoggingUrl" . -}}
{{- if .Values.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $configmapName }}
data:
  {{- with $server }}
  REQUEST_PAYLOAD_LIMIT: {{ .requestPayloadLimit | quote }}
  RESPONSE_COMPRESSION_ENABLED: {{ .responseCompressionEnabled | quote }}
  {{- end }}
  {{- with $telemetry }}
  LOG_LEVEL: {{ .logger.level | quote }}
  LOG_PRETTY_PRINT_ENABLED: {{ .logger.prettyPrint | quote }}
  {{- with .logger.opentelemetryOptions }}
  OPENTELEMETRY_LOGGING_ENABLED: {{ .enabled | quote }}
  {{- if .enabled }}
  OTLP_LOGGER_ENDPOINT_URL: {{ $opentelemetryLoggingUrl | quote }}
  {{- if .resourceAttributes }}
  OTEL_RESOURCE_ATTRIBUTES: {{ include "job-tracker.otelResourceAttributes" .resourceAttributes | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  TELEMETRY_TRACING_ENABLED: {{ .tracing.enabled | quote }}
  {{- if .tracing.enabled }}
  TELEMETRY_TRACING_URL: {{ $tracingUrl | quote }}
  {{- end }}
  {{- end }}
  npm_config_cache: /tmp/
  JOB_MANAGER_BASE_URL: {{ $serviceUrls.jobManager | quote }}
  JOB_DEFINITIONS_JOB_NEW: {{ $jobDefinitions.jobs.new.type | quote }}
  JOB_DEFINITIONS_JOB_UPDATE: {{ $jobDefinitions.jobs.update.type | quote }}
  JOB_DEFINITIONS_JOB_SWAP_UPDATE: {{ $jobDefinitions.jobs.swapUpdate.type | quote }}
  JOB_DEFINITIONS_JOB_EXPORT: {{ $jobDefinitions.jobs.export.type | quote }}
  JOB_DEFINITIONS_JOB_SEED: {{ $jobDefinitions.jobs.seed.type | quote }}
  JOB_DEFINITIONS_JOB_DELETE_LAYER: {{ $jobDefinitions.jobs.deleteLayer.type | quote }}
  JOB_DEFINITIONS_TASK_INIT: {{ $jobDefinitions.tasks.init.type | quote }}
  JOB_DEFINITIONS_TASK_VALIDATION: {{ $jobDefinitions.tasks.validation.type | quote }}
  JOB_DEFINITIONS_TASK_MERGE: {{ $jobDefinitions.tasks.merge.type | quote }}
  JOB_DEFINITIONS_TASK_TILES_DELETION: {{ $jobDefinitions.tasks.tilesDeletion.type | quote }}
  JOB_DEFINITIONS_TASK_POLYGON_PARTS: {{ $jobDefinitions.tasks.polygonParts.type | quote }}
  JOB_DEFINITIONS_TASK_CREATE_TASKS: {{ $jobDefinitions.tasks.createTasks.type | quote }}
  JOB_DEFINITIONS_TASK_EXPORT: {{ $jobDefinitions.tasks.export.type | quote }}
  JOB_DEFINITIONS_TASK_FINALIZE: {{ $jobDefinitions.tasks.finalize.type | quote }}
  JOB_DEFINITIONS_TASK_SEED: {{ $jobDefinitions.tasks.seed.type | quote }}
  JOB_DEFINITIONS_TASK_DELETE: {{ $jobDefinitions.tasks.delete.type | quote }}
  JOB_DEFINITIONS_SUSPENDING_TASKS: {{ $suspendingTaskTypes | quote }}
  INGESTION_TASKS_FLOW: {{ .Values.taskFlowManager.ingestionTasksFlow | toJson | quote }}
  EXPORT_TASKS_FLOW: {{ .Values.taskFlowManager.exportTasksFlow | toJson | quote }}
  SEED_TASKS_FLOW: {{ .Values.taskFlowManager.seedTasksFlow | toJson | quote }}
  DELETE_LAYER_TASKS_FLOW: {{ .Values.taskFlowManager.deleteLayerTasksFlow | toJson | quote }}
  {{- with .Values.configManagement }}
  CONFIG_NAME: {{ .name | quote }}
  CONFIG_VERSION: {{ .version | quote }}
  CONFIG_OFFLINE_MODE: {{ .offlineMode | quote }}
  CONFIG_SERVER_URL: {{ .serverUrl | quote }}
  {{- end -}}
{{- end }}
