global:
  cloudProvider: {}
  telemetry:
    tracing: {}
    logger:
      opentelemetryOptions: {}
  environment: ''
  jobDefinitions: {}
  serviceUrls: {}
  ca:
    secretName: ''
    path: '/usr/local/share/ca-certificates'
    key: 'ca.crt'

mclabels:
  #environment: development
  component: backend
  partOf: core
  owner: raster
  gisDomain: raster
  prometheus:
    enabled: true
    port: 8080

enabled: true
environment: development
replicaCount: 1
revisionHistoryLimit: 5 # Amount of revisions we keep
nodePort: 30030 #for minikube deployment only
resetOnConfigChange: false

nameOverride: ""
fullnameOverride: ""

livenessProbe:
  enabled: true
  initialDelaySeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  path: /liveness

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  path: /liveness

podAnnotations: {}

extraVolumes: []

extraVolumeMounts: []

extraEnvVars: []

command: []
args: []
# command: [ "/bin/sh", "-c", "--" ]
# args: [ "while true; do sleep infinity; done;" ]

sidecars: []

cloudProvider:
  dockerRegistryUrl:
  imagePullSecretName: ''
  flavor: openshift

configManagement:
  offlineMode: true
  name: 'job-tracker'
  version: 'latest'
  serverUrl: 'http://localhost:8080/api'

image:
  repository: job-tracker
  tag: 'latest'
  pullPolicy: IfNotPresent

serviceUrls:
  jobManager: ''
  heartbeatManager: ''

jobDefinitions:
  jobs:
    new:
      type: ''
    update:
      type: ''
    swapUpdate:
      type: ''
    export:
      type: ''
    seed:
      type: ''
    deleteLayer:
      type: ''
  tasks:
    validation:
      type: ''
    init:
      type: ''
    createTasks:
      type: ''
    merge:
      type: ''
    tilesDeletion:
      type: ''
    polygonParts:
      type: ''
      suspendJobOnFail: false
    finalize:
      type: ''
    export:
      type: ''
    seed:
      type: ''
    delete:
      type: ''

taskFlowManager:
  ingestionTasksFlow:
  - validation
  - create-merge-tasks
  - tilesMerging
  - tiles-deletion
  - finalize
  exportTasksFlow:
  - init
  - tilesExporting
  - polygon-parts
  - finalize
  seedTasksFlow:
  - TilesSeeding
  deleteLayerTasksFlow:
  - delete
  - tiles-deletion

server:
  port: 80
  targetPort: 8080
  protocol: TCP
  responseCompressionEnabled: true
  requestPayloadLimit: 1mb

telemetry:
  logger:
    level: info
    prettyPrint: false
    opentelemetryOptions:
      enabled: true
      url: http://localhost:4317
      # Rendered as OTEL_RESOURCE_ATTRIBUTES in "key=value,key=value" format
      # resourceAttributes:
      #   service.namespace: namespace
      #   deployment.environment: dev
  tracing:
    enabled: true
    url: http://localhost:55681/v1/traces

resources:
  enabled: false
  value:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

route:
  enabled: false
  path: /
  host:
  timeout:
    enabled: false # defaults to 30s by openshift
    duration: 60s # supported units (us, ms, s, m, h, d)
  rewriteTarget: ''
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
    useCerts: false
    certificate: ''
    key: ''
    caCertificate: ''

ingress:
  enabled: false
  type: "nginx-org" # supported values: 'nginx-org' | 'nginx-kubernetes'
  path: /
  host: "localhost"
  cors:
    enabled: true
    origin: "*"
